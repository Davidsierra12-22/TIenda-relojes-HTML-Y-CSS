  <title>Golden Store - Login</title>

</head>
    <body class="login-page">

        <div class="login-card">
          <div class="logo-box">
            <!-- REEMPLAZAR CON TU LOGO -->
            <img src="https://acdn-us.mitiendanube.com/stores/804/588/themes/common/logo-1109339747-1722646705-121a101efdd62d9919ad9bfa200c9b101722646705-480-0.webp" alt="Golden Store Logo" class="logo-placeholder">
          </div>
      
          <h2>Iniciar Sesión</h2>

      
          <form class="login-form">
            <div class="input-group">
              <label for="user">Usuario</label>
              <input type="text" id="user" placeholder="Ingresa tu usuario" required>
            </div>
      
            <div class="input-group">
              <label for="pass">Contraseña</label>
              <input type="password" id="pass" placeholder="••••••••" required>
            </div>
                       <a href="loading.html" class="btn-ingresar">INGRESAR</a>
          </form>
        </div>
